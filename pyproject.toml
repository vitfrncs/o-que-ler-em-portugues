[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmatch-ai"
version = "0.1.0"
description = "Hybrid book recommendation system with semantic search and RAG"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.8,<4.0",
    "rank-bm25==0.2.2",
    "sentence-transformers>=5,<7",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.0,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]